<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>김일석 — Forward Deployed AI Engineer · Technical PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Newsreader:ital,wght@0,400..700;1,400..700&family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F4F1EA;
    --bg-2: #EBE7DD;
    --paper: #FCFAF3;
    --ink: #101018;
    --ink-2: #2B2B36;
    --muted: #7B7B85;
    --line: #D4CFC1;
    --accent: #1A3B8F;        /* ink cobalt */
    --accent-lite: #3B5FBF;
    --pop: #E8916D;           /* apricot secondary */
    --pop-2: #C46A46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', -apple-system, sans-serif;
    font-weight: 400;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* subtle grid backdrop */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(16,16,24,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(16,16,24,.035) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.7;
  }

  /* ——— magnetic dot cursor ——— */
  .dot {
    position: fixed; top: 0; left: 0; width: 8px; height: 8px;
    background: var(--accent); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform .2s, background .2s;
  }
  .dot.pop { background: var(--pop); transform: translate(-50%, -50%) scale(2); }
  .dot-label {
    position: fixed; top: 0; left: 0; z-index: 9998;
    padding: 4px 10px; background: var(--ink); color: var(--paper);
    font-family: 'Geist Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 999px; pointer-events: none;
    transform: translate(12px, -50%); opacity: 0;
    transition: opacity .2s;
    white-space: nowrap;
  }
  .dot-label.show { opacity: 1; }
  @media (hover: none) { .dot, .dot-label { display: none; } }

  /* ——— top chrome ——— */
  .chrome {
    position: fixed; top: 0; left: 0; right: 0; height: 64px;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; padding: 0 32px; z-index: 100;
    font-family: 'Geist Mono', monospace; font-size: 11px;
    color: var(--muted); letter-spacing: 0.05em;
    background: linear-gradient(180deg, rgba(244,241,234,.9), transparent);
    backdrop-filter: blur(4px);
  }
  .chrome .brand {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink); font-weight: 500; letter-spacing: 0.1em;
  }
  .chrome .brand::before {
    content: ''; width: 10px; height: 10px; background: var(--accent);
    border-radius: 2px;
  }
  .chrome .center { display: flex; gap: 16px; align-items: center; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 12px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; color: var(--ink-2);
  }
  .status-pill .live {
    width: 6px; height: 6px; border-radius: 50%; background: #2FB570;
    box-shadow: 0 0 0 3px rgba(47,181,112,.2);
    animation: blip 2s infinite;
  }
  @keyframes blip { 0%,100%{opacity:1} 50%{opacity:.4} }
  .chapter-pill {
    padding: 5px 12px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .chapter-pill em { color: var(--accent); font-style: normal; font-weight: 500; }
  .chrome .right { justify-self: end; display: flex; gap: 12px; align-items: center; }
  .lang-toggle { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .lang-toggle button {
    all: unset; cursor: pointer; padding: 4px 12px; border-radius: 999px;
    font-family: 'Geist Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; color: var(--muted);
  }
  .lang-toggle button.active { background: var(--ink); color: var(--paper); }

  /* progress bar */
  .progress {
    position: fixed; top: 63px; left: 0; height: 2px; background: var(--accent);
    z-index: 101; transition: width .1s linear;
  }

  /* ——— section base ——— */
  section {
    min-height: 100vh; padding: 130px 6vw 100px;
    display: flex; flex-direction: column; justify-content: center;
    position: relative; z-index: 1;
  }
  section + section { border-top: 1px solid var(--line); }
  .container { max-width: 1400px; width: 100%; margin: 0 auto; }
  .kicker {
    font-family: 'Geist Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 32px;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 6px 14px; background: var(--paper); border: 1px solid var(--line);
    border-radius: 999px; align-self: flex-start;
  }
  .kicker::before {
    content: '§' attr(data-num);
    color: var(--muted); letter-spacing: 0;
  }
  h1, h2, h3 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    letter-spacing: -0.025em;
    line-height: 1;
    color: var(--ink);
    font-variation-settings: "SOFT" 30, "opsz" 144;
  }
  h1 em, h2 em, h3 em {
    font-style: italic; color: var(--accent);
    font-variation-settings: "SOFT" 100, "opsz" 144;
  }
  h1 .pop, h2 .pop, h3 .pop { color: var(--pop-2); }
  :lang(ko) h1, :lang(ko) h2, :lang(ko) h3,
  :lang(ko) .hero-tagline, :lang(ko) p {
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
  }
  p { color: var(--ink-2); font-size: 16px; line-height: 1.7; }

  /* ——— hero ——— */
  #hero { padding-top: 130px; }
  .hero-container { display: grid; grid-template-columns: 3fr 2fr; gap: 60px; align-items: end; }
  .hero-name {
    font-size: clamp(84px, 14vw, 260px);
    line-height: 0.85;
    letter-spacing: -0.04em;
    font-weight: 300;
  }
  .hero-name .l1 { display: block; }
  .hero-name .l2 { display: block; font-style: italic; padding-left: 0.3em; color: var(--accent); font-variation-settings: "SOFT" 100, "opsz" 144; }

  .hero-side { padding-bottom: 40px; }
  .hero-metabox {
    background: var(--paper); border: 1px solid var(--line);
    padding: 24px; border-radius: 4px; margin-bottom: 24px;
    position: relative;
  }
  .hero-metabox::after {
    content: ''; position: absolute; top: -1px; right: -1px;
    width: 40px; height: 40px;
    background: var(--pop);
    clip-path: polygon(100% 0, 100% 100%, 0 0);
  }
  .hero-metabox .row {
    display: grid; grid-template-columns: 90px 1fr; gap: 16px;
    padding: 8px 0; border-bottom: 1px dashed var(--line);
    font-family: 'Geist Mono', monospace; font-size: 11px;
    color: var(--ink-2);
  }
  .hero-metabox .row:last-child { border-bottom: none; }
  .hero-metabox .row .k { color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .hero-metabox .row .v { color: var(--ink); }
  .hero-tagline {
    font-family: 'Newsreader', serif;
    font-size: clamp(24px, 2.6vw, 34px);
    line-height: 1.3; color: var(--ink);
    font-style: italic; font-weight: 400;
  }
  .hero-tagline em { color: var(--accent); font-style: normal; font-weight: 500; background: linear-gradient(180deg, transparent 60%, rgba(232,145,109,.35) 60%); padding: 0 4px; }

  .hero-footer {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    margin-top: 100px;
    border-top: 1px solid var(--ink);
  }
  .hero-footer-cell {
    padding: 20px 24px 0 0;
    border-right: 1px solid var(--line);
    font-family: 'Geist Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase;
  }
  .hero-footer-cell:last-child { border-right: none; }
  .hero-footer-cell strong { display: block; margin-top: 8px; font-family: 'Fraunces', serif; font-size: 24px; font-weight: 300; color: var(--ink); letter-spacing: -0.01em; text-transform: none; }
  .hero-footer-cell strong.accent { color: var(--accent); font-style: italic; font-variation-settings: "SOFT" 100; }

  /* ——— vision ——— */
  .vision-heading {
    font-size: clamp(56px, 7.5vw, 128px);
    white-space: pre-line; margin-bottom: 40px; max-width: none;
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
  }
  .vision-body {
    display: grid; grid-template-columns: 1fr 2fr; gap: 60px;
    align-items: start; max-width: 1200px;
    padding-top: 40px; border-top: 1px solid var(--line);
  }
  .vision-body .side {
    font-family: 'Geist Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase;
    line-height: 1.8;
  }
  .vision-body .main {
    font-family: 'Newsreader', serif;
    font-size: clamp(20px, 1.7vw, 26px); line-height: 1.55;
    color: var(--ink-2); white-space: pre-line; font-weight: 400;
  }

  /* ——— stats ——— */
  .stats-heading { font-size: clamp(48px, 6.5vw, 108px); margin-bottom: 60px; max-width: none; word-break: keep-all; overflow-wrap: normal; }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
  }
  .stat {
    padding: 28px 20px 24px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px;
    position: relative;
    transition: all .3s;
    overflow: hidden;
  }
  .stat:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px -20px rgba(26,59,143,.25);
    border-color: var(--accent);
  }
  .stat-tag {
    position: absolute; top: 12px; right: 14px;
    font-family: 'Geist Mono', monospace; font-size: 9px;
    color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase;
  }
  .stat-num {
    font-family: 'Fraunces', serif; font-weight: 300;
    font-size: clamp(72px, 9vw, 148px);
    line-height: 0.95; color: var(--ink);
    font-variation-settings: "SOFT" 40, "opsz" 144;
    letter-spacing: -0.03em;
  }
  .stat-num.pop { color: var(--pop-2); font-style: italic; font-variation-settings: "SOFT" 100, "opsz" 144; }
  .stat-num.accent { color: var(--accent); font-style: italic; font-variation-settings: "SOFT" 100, "opsz" 144; }
  .stat-num sup { font-size: 0.35em; vertical-align: super; color: var(--muted); }
  .stat-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-2); margin-top: 16px;
  }
  .stat-note { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ——— why me ——— */
  .why-heading {
    font-size: clamp(52px, 7vw, 116px);
    white-space: pre-line; margin-bottom: 80px; max-width: none;
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
  }
  .why-points {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
  }
  .why-point {
    padding: 32px 28px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; position: relative;
    transition: all .4s;
  }
  .why-point::before {
    content: attr(data-code); position: absolute; top: 20px; right: 20px;
    font-family: 'Geist Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; color: var(--muted);
  }
  .why-point:hover {
    border-color: var(--accent); transform: translateY(-6px);
    box-shadow: 0 25px 50px -25px rgba(26,59,143,.3);
  }
  .why-point-no {
    font-family: 'Fraunces', serif; font-weight: 300;
    font-size: 72px; line-height: 1; color: var(--accent);
    font-style: italic; font-variation-settings: "SOFT" 100, "opsz" 144;
    margin-bottom: 32px;
  }
  .why-point h3 {
    font-family: 'Fraunces', serif; font-size: 24px; line-height: 1.2;
    font-weight: 400; margin-bottom: 16px;
  }
  .why-point p { font-size: 14px; white-space: pre-line; line-height: 1.65; }

  /* ——— capabilities ——— */
  .cap-heading { font-size: clamp(52px, 7vw, 116px); margin-bottom: 60px; }
  .cap-list {
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
    overflow: hidden;
  }
  .cap-row {
    display: grid; grid-template-columns: 60px 130px 1.3fr 2fr;
    gap: 32px; align-items: baseline;
    padding: 28px 32px;
    border-bottom: 1px solid var(--line);
    transition: all .3s;
    position: relative;
  }
  .cap-row:last-child { border-bottom: none; }
  .cap-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); transform: scaleY(0); transform-origin: center;
    transition: transform .3s;
  }
  .cap-row:hover::before { transform: scaleY(1); }
  .cap-row:hover { background: rgba(26,59,143,.03); }
  .cap-no {
    font-family: 'Geist Mono', monospace;
    font-size: 12px; color: var(--muted); letter-spacing: 0.1em;
  }
  .cap-tag {
    display: inline-flex; padding: 4px 10px;
    font-family: 'Geist Mono', monospace;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); background: rgba(26,59,143,.08);
    border-radius: 999px; align-self: baseline;
    width: fit-content;
  }
  .cap-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(20px, 1.9vw, 26px); line-height: 1.25;
    font-weight: 400; color: var(--ink);
  }
  .cap-body { font-size: 14px; color: var(--muted); white-space: pre-line; line-height: 1.65; }

  /* ——— VC (giant black slab) ——— */
  #vc {
    background: var(--ink);
    color: var(--paper);
    padding: 140px 6vw;
  }
  #vc::before {
    content: ''; position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(26,59,143,.5), transparent 45%),
      radial-gradient(ellipse at 85% 80%, rgba(232,145,109,.15), transparent 45%);
    pointer-events: none;
  }
  #vc > .container { position: relative; z-index: 1; }
  #vc .kicker { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); color: var(--pop); }
  #vc .kicker::before { color: rgba(255,255,255,.4); }

  .vc-hero { display: grid; grid-template-columns: 1.8fr 1fr; gap: 60px; align-items: end; margin-bottom: 60px; }
  .vc-title {
    font-family: 'Fraunces', serif; font-weight: 300;
    font-size: clamp(56px, 6.5vw, 100px);
    line-height: 0.95; color: var(--paper);
    letter-spacing: -0.03em; white-space: pre-line;
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
    font-variation-settings: "SOFT" 30, "opsz" 144;
  }
  .vc-title .italic {
    font-style: italic;
    background: linear-gradient(135deg, var(--pop), #F5B896);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    font-variation-settings: "SOFT" 100, "opsz" 144;
  }
  .vc-lede {
    font-family: 'Newsreader', serif;
    font-size: clamp(20px, 1.8vw, 26px);
    line-height: 1.5; color: rgba(255,255,255,.85);
    white-space: pre-line; font-weight: 400;
    padding-bottom: 20px;
  }
  .vc-cta {
    display: inline-flex; align-items: center; gap: 12px;
    margin-top: 24px; padding: 12px 20px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
    border-radius: 999px;
    font-family: 'Geist Mono', monospace; font-size: 11px;
    color: rgba(255,255,255,.9); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .vc-cta .code { color: var(--pop); font-weight: 500; }

  .vc-badges {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px;
    margin-bottom: 80px;
    overflow: hidden;
  }
  .vc-badge {
    padding: 24px;
    border-right: 1px solid rgba(255,255,255,.12);
  }
  .vc-badge:last-child { border-right: none; }
  .vc-badge-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(255,255,255,.5); margin-bottom: 12px;
  }
  .vc-badge-value {
    font-family: 'Fraunces', serif; font-size: 22px; line-height: 1.2;
    color: var(--paper); font-weight: 400;
  }

  .vc-tenets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .vc-tenet {
    padding: 24px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px; background: rgba(255,255,255,.02);
    position: relative;
  }
  .vc-tenet-no {
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 48px; font-style: italic; color: var(--pop);
    font-variation-settings: "SOFT" 100, "opsz" 144;
    line-height: 1; margin-bottom: 20px; font-weight: 300;
  }
  .vc-tenet-body {
    font-family: 'Newsreader', serif;
    font-size: 20px; line-height: 1.45; font-weight: 400;
    color: rgba(255,255,255,.9);
  }

  /* ——— now ——— */
  .now-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 60px; flex-wrap: wrap; gap: 20px; }
  .now-heading { font-size: clamp(52px, 7vw, 116px); }
  .now-range { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--muted); padding: 8px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; }
  .now-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .now-item {
    padding: 28px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px;
    transition: all .3s;
    position: relative;
  }
  .now-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 40px -20px rgba(26,59,143,.2);
    border-color: var(--accent);
  }
  .now-item .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Geist Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase; color: #2FB570;
    margin-bottom: 20px;
    padding: 4px 10px; background: rgba(47,181,112,.1); border-radius: 999px;
  }
  .now-item .status .blip {
    width: 6px; height: 6px; border-radius: 50%; background: #2FB570;
    animation: blip 2s infinite;
  }
  .now-item h3 {
    font-family: 'Fraunces', serif; font-size: 26px; line-height: 1.2;
    margin-bottom: 12px; font-weight: 400;
  }
  .now-item p { font-size: 14px; color: var(--muted); }
  .now-item .id {
    position: absolute; top: 20px; right: 20px;
    font-family: 'Geist Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.1em;
  }

  /* ——— built ——— */
  .built-heading { font-size: clamp(52px, 7vw, 116px); margin-bottom: 60px; }
  .built-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--paper); }
  .built-card {
    padding: 28px 24px 24px;
    border-right: 1px solid var(--line);
    transition: all .3s;
    position: relative;
    display: flex; flex-direction: column; gap: 12px;
    min-height: 240px;
    cursor: pointer;
  }
  .built-card:last-child { border-right: none; }
  .built-card:hover {
    background: var(--ink);
    color: var(--paper);
  }
  .built-card:hover .built-name { color: var(--pop); }
  .built-card:hover .built-url { color: rgba(255,255,255,.6); }
  .built-card:hover .built-desc, .built-card:hover .built-num { color: rgba(255,255,255,.7); }
  .built-card:hover .built-arrow { background: var(--pop); color: var(--ink); border-color: var(--pop); }
  .built-num {
    font-family: 'Geist Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; color: var(--muted);
    transition: color .3s;
  }
  .built-name {
    font-family: 'Fraunces', serif; font-size: 34px; line-height: 1;
    font-weight: 400; letter-spacing: -0.02em; transition: color .3s;
  }
  .built-url {
    font-family: 'Geist Mono', monospace; font-size: 11px;
    color: var(--accent); letter-spacing: 0.03em; transition: color .3s;
  }
  .built-desc { font-size: 13px; color: var(--muted); line-height: 1.55; transition: color .3s; }
  .built-arrow {
    align-self: flex-start; margin-top: auto;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Geist Mono', monospace; font-size: 14px;
    color: var(--ink); transition: all .3s;
  }

  /* ——— enterprise ——— */
  .ent-heading { font-size: clamp(52px, 7vw, 116px); margin-bottom: 60px; }
  .ent-list {
    background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
    overflow: hidden;
  }
  .ent-row {
    display: grid; grid-template-columns: 80px 1fr 1.6fr;
    gap: 32px; padding: 28px 32px;
    border-bottom: 1px solid var(--line);
    align-items: baseline;
    transition: all .3s;
    position: relative;
  }
  .ent-row::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); transform: scaleY(0); transition: transform .3s;
  }
  .ent-row:hover::before { transform: scaleY(1); }
  .ent-row:hover { background: rgba(26,59,143,.03); }
  .ent-row:last-child { border-bottom: none; }
  .ent-year {
    font-family: 'Fraunces', serif; font-size: 32px;
    color: var(--muted); font-weight: 300;
    font-variation-settings: "opsz" 144;
  }
  .ent-company {
    font-family: 'Fraunces', serif; font-size: 24px; line-height: 1.2;
    font-weight: 400; margin-bottom: 6px;
  }
  .ent-role {
    font-family: 'Geist Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase;
  }
  .ent-body { font-size: 14px; color: var(--ink-2); line-height: 1.65; }
  .ent-period { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 4px; display: block; }

  /* ——— samsung ——— */
  #samsung { background: var(--bg-2); }
  .sam-hero { display: grid; grid-template-columns: 1.7fr 1fr; gap: 60px; align-items: end; margin-bottom: 80px; }
  .sam-heading {
    font-size: clamp(40px, 4.5vw, 76px);
    white-space: pre-line; line-height: 1.05;
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
  }
  .sam-note {
    font-family: 'Newsreader', serif;
    font-size: 20px; line-height: 1.55; color: var(--ink-2);
    padding-bottom: 20px; font-style: italic; font-weight: 400;
  }
  .sam-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
  .sam-item {
    padding: 24px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 4px;
    transition: all .3s;
  }
  .sam-item:hover { border-color: var(--accent); transform: translateY(-3px); }
  .sam-item h4 {
    font-family: 'Fraunces', serif; font-size: 20px; line-height: 1.3;
    font-weight: 400; margin-bottom: 10px; color: var(--ink);
  }
  .sam-item p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ——— stack ——— */
  .stack-heading { font-size: clamp(52px, 7vw, 116px); margin-bottom: 60px; }
  .stack-groups { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .stack-group {
    padding: 24px 20px;
    border-right: 1px solid var(--line);
  }
  .stack-group:last-child { border-right: none; }
  .stack-group-label {
    font-family: 'Geist Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px dashed var(--line);
  }
  .stack-items { display: flex; flex-direction: column; gap: 8px; }
  .stack-item {
    font-family: 'Fraunces', serif; font-size: 17px; color: var(--ink);
    font-weight: 400; line-height: 1.3;
  }

  /* ——— education ——— */
  .edu-heading { font-size: clamp(52px, 7vw, 116px); margin-bottom: 40px; }
  .edu-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
  .edu-block {
    padding: 24px; background: var(--paper);
    border: 1px solid var(--line); border-radius: 4px;
  }
  .edu-block h4 {
    font-family: 'Geist Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .edu-item {
    padding: 10px 0; border-bottom: 1px dashed var(--line);
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .edu-item:last-child { border-bottom: none; }
  .edu-item .name { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 400; }
  .edu-item .meta { font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }

  /* ——— contact ——— */
  #contact {
    background: var(--ink); color: var(--paper);
    padding: 140px 6vw;
  }
  #contact::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 30% 30%, rgba(26,59,143,.4), transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(232,145,109,.2), transparent 50%);
    pointer-events: none;
  }
  #contact > .container { position: relative; z-index: 1; text-align: center; }
  #contact .kicker { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); color: var(--pop); }
  #contact .kicker::before { color: rgba(255,255,255,.4); }
  .contact-heading {
    font-family: 'Fraunces', serif; font-weight: 300;
    font-size: clamp(56px, 9vw, 168px);
    line-height: 0.95; color: var(--paper);
    margin-bottom: 40px;
    font-variation-settings: "SOFT" 40, "opsz" 144;
  }
  .contact-heading em {
    font-style: italic;
    background: linear-gradient(135deg, var(--pop), #F5B896);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    font-variation-settings: "SOFT" 100, "opsz" 144;
  }
  .contact-body {
    font-family: 'Newsreader', serif; font-size: 22px; line-height: 1.5;
    color: rgba(255,255,255,.75); margin-bottom: 60px; white-space: pre-line;
    font-weight: 400; font-style: italic;
  }
  .contact-methods {
    display: inline-grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin: 0 auto;
  }
  .contact-item {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    font-family: 'Geist Mono', monospace; font-size: 15px;
    color: var(--paper); letter-spacing: 0.03em;
    padding: 20px 28px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.15); border-radius: 4px;
    transition: all .3s; text-align: left;
    min-width: 260px;
  }
  .contact-item:hover {
    background: var(--pop); border-color: var(--pop); color: var(--ink);
    transform: translateY(-2px);
  }
  .contact-item:hover .lbl { color: rgba(16,16,24,.6); }
  .contact-item .lbl { color: rgba(255,255,255,.5); font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; }
  .contact-footer {
    display: flex; justify-content: space-between;
    margin-top: 100px; padding-top: 40px; border-top: 1px solid rgba(255,255,255,.1);
    font-family: 'Geist Mono', monospace; font-size: 10px;
    color: rgba(255,255,255,.4); letter-spacing: 0.15em; text-transform: uppercase;
  }

  @media (max-width: 900px) {
    section { padding: 100px 5vw 80px; }
    .hero-container, .vc-hero, .sam-hero, .vision-body { grid-template-columns: 1fr; gap: 40px; }
    .stats, .why-points, .now-grid, .built-list, .stack-groups, .sam-grid, .vc-badges, .vc-tenets, .edu-grid, .hero-footer { grid-template-columns: 1fr 1fr; }
    .cap-row, .ent-row { grid-template-columns: 40px 1fr; gap: 16px; padding: 24px; }
    .cap-body, .ent-body { grid-column: 2; }
    .contact-methods { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="dot" id="dot"></div>
<div class="dot-label" id="dotLabel">Click</div>
<div class="progress" id="progress" style="width:0"></div>

<div class="chrome">
  <div class="brand">ILSUK.KIM</div>
  <div class="center">
    <span class="status-pill"><span class="live"></span><span id="chapterTitle">Cover</span></span>
    <span class="chapter-pill">§<em id="chapterNum">01</em> / <span id="chapterTotal">13</span></span>
  </div>
  <div class="right">
    <span class="lang-toggle">
      <button data-lang="ko" class="active">KO</button>
      <button data-lang="en">EN</button>
    </span>
  </div>
</div>

<main id="main"></main>

<script src="shared/content.js"></script>
<script>
(function() {
  const C = window.PORTFOLIO_CONTENT;
  let lang = localStorage.getItem('ilsuk_lang') || 'ko';
  const t = (v) => (v && typeof v === 'object' && (v.ko || v.en)) ? (v[lang] || v.ko || v.en) : v;

  const CHAPTERS_TITLE = {
    hero:'Cover', vision:'Vision', glance:'Numbers', why:'Why me', capabilities:'Capabilities',
    vc:'VC-Framework', now:'Now', built:'Shipped', enterprise:'Enterprise',
    samsung:'Samsung SDS', stack:'Stack', education:'Education', contact:'Contact'
  };

  function renderHero() {
    const isKo = lang === 'ko';
    return `
      <section id="hero" data-chapter="01" data-screen-label="01 Hero">
        <div class="container">
          <div class="hero-container">
            <div>
              <h1 class="hero-name">
                <span class="l1">${isKo?'김일석':'Ilsuk'}</span>
                <span class="l2">${isKo?'Kim.':'Kim.'}</span>
              </h1>
            </div>
            <div class="hero-side">
              <div class="hero-metabox">
                <div class="row"><span class="k">Role</span><span class="v">FDE · Technical PM</span></div>
                <div class="row"><span class="k">Focus</span><span class="v">AI product delivery</span></div>
                <div class="row"><span class="k">Since</span><span class="v">1996 · 30 yrs</span></div>
                <div class="row"><span class="k">Base</span><span class="v">Seoul · Remote-OK</span></div>
                <div class="row"><span class="k">Status</span><span class="v">Open to opportunities</span></div>
              </div>
              <div class="hero-tagline">${isKo?'AI 서비스를 <em>실제로 만들어 본</em> PM.':'A PM who has <em>actually shipped</em> AI products.'}</div>
            </div>
          </div>
          <div class="hero-footer">
            <div class="hero-footer-cell">Copyright · ${isKo?'저작권':'Registered'}<strong class="accent">VC-Framework</strong></div>
            <div class="hero-footer-cell">${isKo?'AI 서비스':'AI products'} · Shipped<strong>5+ services</strong></div>
            <div class="hero-footer-cell">${isKo?'글로벌 확산':'Global rollout'}<strong>5 countries</strong></div>
            <div class="hero-footer-cell">${isKo?'엔터프라이즈':'Enterprise'} · Samsung SDS<strong>20 years</strong></div>
          </div>
        </div>
      </section>
    `;
  }

  function renderVision() {
    return `
      <section id="vision" data-chapter="02" data-screen-label="02 Vision">

          <div class="kicker" data-num="02">${t(C.vision.kicker)}</div>
          <h2 class="vision-heading">${t(C.vision.heading).replace(/AI 서비스를 “만드는” PM|a PM who builds AI products/g, m => `<em>${m}</em>`)}</h2>

            <div class="side">${lang==='ko'?'포지셔닝 노트<br/>——<br/>2026':'Positioning note<br/>——<br/>2026'}</div>
            <div class="main">${t(C.vision.body)}</div>
          </div>
        </div>
      </section>
    `;
  }

  function renderStats() {
    const tags = ['/CAREER','/COUNTRIES','/PROJECTS','/IP'];
    const items = C.stats.map((s, i) => `
      <div class="stat">
        <span class="stat-tag">${tags[i]}</span>
        <div class="stat-num ${i===1?'pop':i===3?'accent':''}">${s.value}${i===0?'<sup>yrs</sup>':''}</div>

        <div class="stat-note">${t(s.note)}</div>
      </div>
    `).join('');
    return `
      <section id="glance" data-chapter="03" data-screen-label="03 At a glance">

          <div class="kicker" data-num="03">At a glance</div>
          <h2 class="stats-heading">${lang==='ko'?'숫자로 <em>먼저</em>, <span class="pop">맥락</span>으로 다음.':'The <em>numbers</em> first, the <span class="pop">context</span> after.'}</h2>
          <div class="stats">${items}</div>
        </div>
      </section>
    `;
  }

  function renderWhy() {
    const codes = ['DEPTH-01','SHIP-02','METHOD-03'];
    const points = C.whyMe.points.map((p, i) => `
      <div class="why-point" data-code="${codes[i]}">
        <div class="why-point-no">0${i+1}</div>
        <h3>${t(p.title)}</h3>
        <p>${t(p.body)}</p>
      </div>
    `).join('');
    return `
      <section id="why" data-chapter="04" data-screen-label="04 Why me">
        <div class="container">
          <div class="kicker" data-num="04">${t(C.whyMe.kicker)}</div>
          <h2 class="why-heading">${t(C.whyMe.heading).replace(/드뭅니다|rarer than you think/g, m => `<em>${m}</em>`)}</h2>
          <div class="why-points">${points}</div>
        </div>
      </section>
    `;
  }

  function renderCapabilities() {
    const rows = C.capabilities.items.map(item => `
      <div class="cap-row">
        <div class="cap-no">${item.no}</div>
        <div class="cap-tag">${t(item.tag)}</div>
        <div class="cap-title">${t(item.title)}</div>
        <div class="cap-body">${t(item.body)}</div>
      </div>
    `).join('');
    return `
      <section id="capabilities" data-chapter="05" data-screen-label="05 Capabilities">
        <div class="container">
          <div class="kicker" data-num="05">${t(C.capabilities.kicker)}</div>

          <div class="cap-list">${rows}</div>
        </div>
      </section>
    `;
  }

  function renderVC() {
    const badges = C.vc.badges.map(b => `
      <div class="vc-badge">
        <div class="vc-badge-label">${t(b.label)}</div>
        <div class="vc-badge-value">${t(b.value)}</div>
      </div>
    `).join('');
    const tenets = C.vc.tenets.map((tn, i) => `
      <div class="vc-tenet">
        <span class="vc-tenet-no">${i+1}</span>
        <div class="vc-tenet-body">${t(tn)}</div>
      </div>
    `).join('');
    return `
      <section id="vc" data-chapter="06" data-screen-label="06 VC-Framework">
        <div class="container">
          <div class="kicker" data-num="06">${t(C.vc.kicker)}</div>
          <div class="vc-hero">
            <div>
              <h2 class="vc-title">${t(C.vc.heading).replace(/Vibe Coding/g, '<span class="italic">Vibe Coding</span>')}</h2>
            </div>
            <div>
              <div class="vc-lede">${t(C.vc.lede)}</div>
              <div class="vc-cta"><span class="code">C-2026-015049</span> · ${lang==='ko'?'한국저작권위원회':'KCC'} · ${lang==='ko'?'특허 출원 중':'Patent pending'}</div>

          </div>
          <div class="vc-badges">${badges}</div>
          <div class="vc-tenets">${tenets}</div>
        </div>
      </section>
    `;
  }

  function renderNow() {
    const items = C.now.items.map((item, i) => `
      <div class="now-item">
        <span class="id">#N0${i+1}</span>
        <div class="status"><span class="blip"></span>${lang==='ko'?'진행 중':'Active'}</div>
        <h3>${t(item.title)}</h3>
        <p>${t(item.body)}</p>
      </div>
    `).join('');
    return `
      <section id="now" data-chapter="07" data-screen-label="07 Now">
        <div class="container">
          <div class="kicker" data-num="07">${t(C.now.kicker)}</div>
          <div class="now-header">
            <h2 class="now-heading">${t(C.now.heading).replace(/일|now/g, m => `<em>${m}</em>`)}</h2>
            <div class="now-range">${t(C.now.range)}</div>
          </div>
          <div class="now-grid">${items}</div>
        </div>
      </section>
    `;
  }

  function renderBuilt() {
    const items = C.builtSites.items.map((s, i) => `
      <a class="built-card" href="https://${s.url}" target="_blank" rel="noopener">
        <div class="built-num">/ 0${i+1}</div>
        <div class="built-name">${s.name}</div>
        <div class="built-url">${s.url}</div>
        <div class="built-desc">${t(s.desc)}</div>
        <div class="built-arrow">↗</div>
      </a>
    `).join('');
    return `
      <section id="built" data-chapter="08" data-screen-label="08 Shipped">
        <div class="container">
          <div class="kicker" data-num="08">${t(C.builtSites.kicker)}</div>
          <h2 class="built-heading">${t(C.builtSites.heading).replace(/만든|shipped/g, m => `<em>${m}</em>`)}</h2>
          <div class="built-list">${items}</div>
        </div>
      </section>
    `;
  }

  function renderEnterprise() {
    const rows = C.enterpriseCareer.items.map(item => `
      <div class="ent-row">
        <div class="ent-year">${item.year}</div>
        <div>
          <div class="ent-company">${t(item.company)}</div>
          <div class="ent-role">${t(item.role)}</div>
          <span class="ent-period">${item.period}</span>
        </div>
        <div class="ent-body">${t(item.body)}</div>
      </div>
    `).join('');
    return `
      <section id="enterprise" data-chapter="09" data-screen-label="09 Enterprise">
        <div class="container">
          <div class="kicker" data-num="09">${t(C.enterpriseCareer.kicker)}</div>
          <h2 class="ent-heading">${t(C.enterpriseCareer.heading).replace(/시간|scale/g, m => `<em>${m}</em>`)}</h2>
          <div class="ent-list">${rows}</div>
        </div>
      </section>

  function renderSamsung() {
    const items = C.samsungEra.items.map(item => `
      <div class="sam-item">
        <h4>${t(item.title)}</h4>
        <p>${t(item.body)}</p>
      </div>
    `).join('');
    return `
      <section id="samsung" data-chapter="10" data-screen-label="10 Samsung SDS">

          <div class="kicker" data-num="10">${t(C.samsungEra.kicker)}</div>

  function renderStack() {
    const groups = C.stack.groups.map(g => `
      <div class="stack-group">
        <div class="stack-group-label">${t(g.label)}</div>
        <div class="stack-items">
          ${g.items.map(x => `<span class="stack-item">${x}</span>`).join('')}

    return `
      <section id="stack" data-chapter="11" data-screen-label="11 Stack">
        <div class="container">
          <div class="kicker" data-num="11">${t(C.stack.kicker)}</div>
          <h2 class="stack-heading">${t(C.stack.heading).replace(/것들|with/g, m => `<em>${m}</em>`)}</h2>
          <div class="stack-groups">${groups}</div>
        </div>
      </section>
    `;

  function renderEducation() {
    const schools = C.education.schools.map(s => `
      <div class="edu-item">
        <span class="name">${t(s.school)}</span>
        <span class="meta">${s.year}</span>
      </div>
    `).join('');
    const certs = C.education.certs.map(c => `<div class="edu-item"><span class="name">${t(c)}</span></div>`).join('');
    const langs = C.education.languages.map(l => `<div class="edu-item"><span class="name">${t(l)}</span></div>`).join('');

  function renderContact() {
    return `
      <section id="contact" data-chapter="13" data-screen-label="13 Contact">
        <div class="container">
          <div class="kicker" data-num="13" style="margin-left:auto;margin-right:auto;display:inline-flex">${t(C.contact.kicker)}</div>
          <h2 class="contact-heading">${t(C.contact.heading).replace(/만들어 볼까요|build together/g, m => `<em>${m}</em>`)}</h2>

          <div class="contact-methods">

              <span class="lbl">Email</span>
              <span>${C.meta.email}</span>
            </a>
          </div>
          <div class="contact-footer">
            <span>© 2026 Jasmine Kim · All rights reserved</span>
            <span>Concept C · Ink Cobalt</span>
          </div>
        </div>
      </section>
    `;
  }

  function render() {
    document.getElementById('main').innerHTML = [
      renderHero(), renderVision(), renderStats(), renderWhy(), renderCapabilities(),
      renderVC(), renderNow(), renderBuilt(), renderEnterprise(),
      renderSamsung(), renderStack(), renderEducation(), renderContact(),
    ].join('');
    document.getElementById('chapterTotal').textContent = '13';
    attachHovers();
  }

  // cursor dot
  const dot = document.getElementById('dot');
  const dotLabel = document.getElementById('dotLabel');
  document.addEventListener('mousemove', e => {
    dot.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
    dotLabel.style.transform = `translate(${e.clientX + 16}px, ${e.clientY}px) translate(0, -50%)`;
  });

  function attachHovers() {
    document.querySelectorAll('a, button, .cap-row, .now-item, .built-card, .why-point, .stat, .ent-row, .sam-item').forEach(el => {
      const label = el.tagName === 'A' ? 'OPEN' :
                    el.classList.contains('built-card') ? 'VISIT →' :
                    'DETAILS';
      el.addEventListener('mouseenter', () => {
        dot.classList.add('pop');
        dotLabel.textContent = label;
        dotLabel.classList.add('show');
      });
      el.addEventListener('mouseleave', () => {
        dot.classList.remove('pop');
        dotLabel.classList.remove('show');
      });
    });
  }

  // chapter tracking
  function updateChapter() {
    const sections = document.querySelectorAll('section[data-chapter]');
    const mid = window.innerHeight / 2;
    let current = { num: '01', id: 'hero' };
    sections.forEach(s => {
      const r = s.getBoundingClientRect();
      if (r.top <= mid && r.bottom >= mid) current = { num: s.dataset.chapter, id: s.id };
    });
    document.getElementById('chapterNum').textContent = current.num;
    document.getElementById('chapterTitle').textContent = CHAPTERS_TITLE[current.id] || 'Section';

    const h = document.documentElement.scrollHeight - window.innerHeight;
    const p = Math.min(100, (window.scrollY / h) * 100);
    document.getElementById('progress').style.width = p + '%';
  }
  window.addEventListener('scroll', updateChapter, { passive: true });

  document.querySelectorAll('.lang-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      lang = btn.dataset.lang;
      localStorage.setItem('ilsuk_lang', lang);
      document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.documentElement.lang = lang === 'ko' ? 'ko' : 'en';
      render(); updateChapter();
    });
  });

  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.documentElement.lang = lang === 'ko' ? 'ko' : 'en';
  render();
  updateChapter();
})();
</script>

</body>
</html>
