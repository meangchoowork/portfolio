<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>김일석 — Forward Deployed AI Engineer · Technical PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F1EEE6;
    --bg-2: #E7E3D8;
    --paper: #F8F5EB;
    --ink: #14211A;
    --ink-2: #2E3B33;
    --muted: #6E766F;
    --line: #C4C0B3;
    --accent: #2F5D3F;        /* deep forest */
    --accent-hi: #4A7D5C;
    --accent-tint: rgba(47,93,63,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    font-weight: 300;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }

  /* subtle grain */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    opacity: 0.35;
    background-image:
      radial-gradient(rgba(20,33,26,.06) 1px, transparent 1px),
      radial-gradient(rgba(20,33,26,.04) 1px, transparent 1px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1px 1px;
    mix-blend-mode: multiply;
  }

  /* ——— spotlight cursor ——— */
  .spotlight {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%),
      rgba(74,125,92,.09), transparent 60%);
    transition: background .1s;
  }

  /* ——— top chrome ——— */
  .chrome {
    position: fixed; top: 0; left: 0; right: 0; height: 60px;
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; padding: 0 32px; z-index: 100;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--muted); letter-spacing: 0.05em;
    border-bottom: 1px solid transparent;
    transition: border-color .3s, background .3s;
    backdrop-filter: blur(6px);
  }
  .chrome.scrolled { border-bottom-color: var(--line); background: rgba(241,238,230,.7); }
  .chrome .brand { color: var(--ink); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; }
  .chrome .center { display: flex; gap: 20px; align-items: center; }
  .chapter-badge {
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
    font-variant-numeric: tabular-nums; background: var(--paper);
  }
  .chapter-badge em { color: var(--accent); font-style: normal; font-weight: 500; }
  .chapter-title { color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.15em; }
  .chrome .right { justify-self: end; display: flex; align-items: center; gap: 20px; }
  .lang-toggle { display: inline-flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--paper); }
  .lang-toggle button {
    all: unset; cursor: pointer; padding: 5px 10px; font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em; color: var(--muted);
  }
  .lang-toggle button.active { background: var(--ink); color: var(--paper); }

  /* ——— left rail: table of contents ——— */
  .toc {
    position: fixed; left: 24px; top: 50%; transform: translateY(-50%);
    z-index: 50; display: flex; flex-direction: column; gap: 8px;
  }
  .toc-item {
    display: flex; align-items: center; gap: 12px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.1em;
    padding: 4px 0; cursor: pointer;
    transition: color .3s;
  }
  .toc-item .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--line);
    transition: all .3s;
  }
  .toc-item .label { opacity: 0; transform: translateX(-8px); transition: all .3s; }
  .toc:hover .toc-item .label { opacity: 1; transform: translateX(0); }
  .toc-item.active { color: var(--ink); }
  .toc-item.active .dot { background: var(--accent); transform: scale(1.6); }
  @media (max-width: 900px) { .toc { display: none; } }

  /* ——— section base ——— */
  section {
    min-height: 100vh; padding: 120px 12vw 100px 14vw;
    display: flex; flex-direction: column; justify-content: center;
    position: relative;
  }
  section + section { border-top: 1px solid var(--line); }
  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 32px;
    display: flex; align-items: center; gap: 14px;
  }
  .kicker::before {
    content: attr(data-num);
    color: var(--muted); font-weight: 500;
    padding-right: 14px; border-right: 1px solid var(--line);
  }
  h1, h2, h3 {
    font-family: 'EB Garamond', serif;
    font-weight: 400;
    letter-spacing: -0.015em;
    line-height: 1.05;
    color: var(--ink);
  }
  h1 em, h2 em, h3 em { font-style: italic; color: var(--accent); }
  :lang(ko) h1, :lang(ko) h2, :lang(ko) h3,
  :lang(ko) .hero-tagline, :lang(ko) p {
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
  }
  p { color: var(--ink-2); font-size: 16px; line-height: 1.7; font-weight: 300; }

  /* ——— hero ——— */
  #hero { padding-top: 100px; }
  .hero-marks {
    display: flex; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase;
    margin-bottom: 60px;
  }
  .hero-name-row {
    display: flex; align-items: baseline; gap: 40px; flex-wrap: wrap;
    margin-bottom: 60px;
  }
  .hero-name {
    font-family: 'EB Garamond', serif; font-weight: 400;
    font-size: clamp(72px, 12vw, 200px);
    line-height: 0.9; letter-spacing: -0.02em;
  }
  .hero-name .italic { font-style: italic; color: var(--accent); }
  .hero-badge {
    padding: 10px 18px; border: 1px solid var(--accent); border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase;
    background: var(--paper);
    align-self: center;
  }
  .hero-body {
    display: grid; grid-template-columns: 1fr 1.4fr; gap: 60px;
    padding-top: 40px; border-top: 1px solid var(--line);
  }
  .hero-body .label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 12px;
  }
  .hero-position-full {
    font-family: 'EB Garamond', serif; font-size: 22px; line-height: 1.4;
    color: var(--ink); font-weight: 400;
  }
  .hero-tagline {
    font-family: 'EB Garamond', serif;
    font-size: clamp(28px, 3vw, 44px);
    line-height: 1.25; color: var(--ink);
    font-weight: 400;
  }
  .hero-tagline em { font-style: italic; color: var(--accent); }

  /* ——— vision ——— */
  .vision-heading {
    font-size: clamp(48px, 6.5vw, 104px);
    white-space: pre-line; margin-bottom: 40px; max-width: none;
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
  }
  .vision-body {
    max-width: 700px; font-family: 'EB Garamond', serif;
    font-size: clamp(20px, 1.6vw, 26px); line-height: 1.5;
    color: var(--ink-2); font-weight: 400; white-space: pre-line;
  }

  /* ——— stats ——— */
  .stats-heading { font-size: clamp(40px, 5.5vw, 88px); margin-bottom: 60px; max-width: none; word-break: keep-all; overflow-wrap: normal; }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    border-top: 1px solid var(--ink);
  }
  .stat {
    padding: 32px 24px 32px 0;
    border-right: 1px solid var(--line);
    position: relative;
  }
  .stat:last-child { border-right: none; }
  .stat:not(:last-child) { padding-right: 24px; }
  .stat + .stat { padding-left: 24px; }
  .stat-num {
    font-family: 'EB Garamond', serif; font-weight: 400;
    font-size: clamp(56px, 7vw, 120px);
    line-height: 0.95;
    color: var(--ink);
  }
  .stat-num.italic { font-style: italic; color: var(--accent); }
  .stat-num sup {
    font-size: 0.4em; vertical-align: super;
    color: var(--muted); font-weight: 300;
  }
  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-2); margin-top: 16px;
  }
  .stat-note { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: 'EB Garamond', serif; font-style: italic; font-weight: 400; }

  /* ——— why me ——— */
  .why-heading {
    font-size: clamp(48px, 6.5vw, 104px);
    white-space: pre-line; margin-bottom: 80px; max-width: none;
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
  }
  .why-points { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--line); }
  .why-point {
    display: grid; grid-template-columns: 80px 1fr 2fr; gap: 40px;
    padding: 48px 0; border-bottom: 1px solid var(--line);
    align-items: baseline;
    transition: padding-left .3s;
  }
  .why-point:hover { padding-left: 24px; background: var(--accent-tint); }
  .why-point-no {
    font-family: 'EB Garamond', serif; font-size: 28px;
    color: var(--accent); font-style: italic; font-weight: 400;
  }
  .why-point h3 {
    font-family: 'EB Garamond', serif;
    font-size: clamp(24px, 2.2vw, 32px); line-height: 1.15;
    font-weight: 400;
  }
  .why-point p { white-space: pre-line; }

  /* ——— capabilities ——— */
  .cap-heading { font-size: clamp(48px, 6.5vw, 104px); margin-bottom: 60px; }
  .cap-table {
    border-top: 1px solid var(--ink);
  }
  .cap-row {
    display: grid; grid-template-columns: 60px 140px 1.4fr 2fr;
    gap: 40px; align-items: baseline;
    padding: 32px 0;
    border-bottom: 1px solid var(--line);
    transition: background .3s;
    position: relative;
  }
  .cap-row:hover { background: var(--accent-tint); }
  .cap-row:hover .cap-no { color: var(--accent); }
  .cap-no {
    font-family: 'EB Garamond', serif;
    font-size: 18px; font-weight: 400; font-style: italic;
    color: var(--muted);
    transition: color .3s;
  }
  .cap-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent);
  }
  .cap-title {
    font-family: 'EB Garamond', serif;
    font-size: clamp(20px, 1.9vw, 26px); line-height: 1.25;
    font-weight: 500; color: var(--ink);
  }
  .cap-body { font-size: 14px; color: var(--muted); white-space: pre-line; line-height: 1.65; }

  /* ——— VC-Framework (big independent) ——— */
  #vc {
    background: var(--ink);
    color: var(--paper);
    padding: 140px 12vw 140px 14vw;
  }
  #vc::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(74,125,92,.12), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(74,125,92,.08), transparent 50%);
    pointer-events: none;
  }
  #vc > * { position: relative; z-index: 1; }
  #vc .kicker { color: var(--accent-hi); }
  #vc .kicker::before { color: rgba(248,245,235,.4); border-right-color: rgba(248,245,235,.15); }
  .vc-hero {
    display: grid; grid-template-columns: 1.8fr 1fr; gap: 60px;
    align-items: end; margin-bottom: 80px;
  }
  .vc-title {
    font-family: 'EB Garamond', serif; font-weight: 400;
    font-size: clamp(56px, 6.5vw, 100px);
    line-height: 0.95; color: var(--paper);
    letter-spacing: -0.02em;
    white-space: pre-line;
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
  }
  .vc-title .italic { font-style: italic; color: var(--accent-hi); }
  .vc-lede {
    font-family: 'EB Garamond', serif;
    font-size: clamp(20px, 1.8vw, 28px);
    line-height: 1.45; color: rgba(248,245,235,.8);
    white-space: pre-line; font-weight: 400;
    padding-bottom: 12px;
  }
  .vc-cert {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 10px 18px; margin-top: 24px;
    border: 1px solid rgba(248,245,235,.25); border-radius: 999px;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: rgba(248,245,235,.85); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .vc-cert .seal {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent-hi);
    box-shadow: 0 0 0 4px rgba(74,125,92,.2);
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 4px rgba(74,125,92,.2); } 50% { box-shadow: 0 0 0 8px rgba(74,125,92,.05); } }
  .vc-badges {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
    border-top: 1px solid rgba(248,245,235,.15);
    border-bottom: 1px solid rgba(248,245,235,.15);
    padding: 36px 0; margin-bottom: 80px;
  }
  .vc-badge-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(248,245,235,.5); margin-bottom: 12px;
  }
  .vc-badge-value {
    font-family: 'EB Garamond', serif; font-size: 22px; line-height: 1.2;
    color: var(--paper); font-weight: 400;
  }
  .vc-tenets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 60px; }
  .vc-tenet {
    padding-top: 20px;
    border-top: 1px solid rgba(248,245,235,.15);
  }
  .vc-tenet-no {
    font-family: 'EB Garamond', serif; font-size: 22px; font-style: italic;
    color: var(--accent-hi); display: block; margin-bottom: 12px;
  }
  .vc-tenet-body {
    font-family: 'EB Garamond', serif;
    font-size: 20px; line-height: 1.45;
    color: rgba(248,245,235,.9);
  }

  /* ——— now ——— */
  .now-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 60px; flex-wrap: wrap; gap: 20px; }
  .now-heading { font-size: clamp(48px, 6.5vw, 104px); }
  .now-range { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--muted); padding: 6px 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; }
  .now-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
  .now-item {
    padding: 32px; background: var(--paper);
    border: 1px solid var(--line);
    transition: all .3s;
    position: relative;
  }
  .now-item:hover {
    border-color: var(--accent); transform: translateY(-3px);
    box-shadow: 0 15px 40px -20px rgba(47,93,63,.3);
  }
  .now-item .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent);
    margin-bottom: 20px;
  }
  .now-item .status::before {
    content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .now-item h3 {
    font-family: 'EB Garamond', serif; font-size: 26px; line-height: 1.2;
    margin-bottom: 12px; font-weight: 500;
  }
  .now-item p { font-size: 15px; color: var(--muted); }

  /* ——— built sites ——— */
  .built-heading { font-size: clamp(48px, 6.5vw, 104px); margin-bottom: 60px; }
  .built-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--ink); }
  .built-card {
    padding: 32px 24px 28px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transition: all .3s;
    position: relative;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 220px;
    cursor: pointer;
  }
  .built-card:last-child { border-right: none; }
  .built-card:hover {
    background: var(--accent); color: var(--paper);
    border-color: var(--accent);
  }
  .built-card:hover .built-num,
  .built-card:hover .built-url { color: rgba(248,245,235,.7); }
  .built-card:hover .built-desc { color: rgba(248,245,235,.85); }
  .built-num {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; color: var(--muted); transition: color .3s;
  }
  .built-name {
    font-family: 'EB Garamond', serif; font-size: 34px; line-height: 1;
    font-weight: 400; letter-spacing: -0.02em;
  }
  .built-name .italic { font-style: italic; color: var(--accent); }
  .built-card:hover .built-name .italic { color: var(--paper); }
  .built-url {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--accent); letter-spacing: 0.05em; transition: color .3s;
  }
  .built-desc { font-size: 13px; color: var(--muted); margin-top: auto; line-height: 1.5; transition: color .3s; }

  /* ——— enterprise ——— */
  .ent-heading { font-size: clamp(48px, 6.5vw, 104px); margin-bottom: 60px; }
  .ent-list { border-top: 1px solid var(--ink); }
  .ent-row {
    display: grid; grid-template-columns: 100px 1fr 1.6fr;
    gap: 40px; padding: 36px 0;
    border-bottom: 1px solid var(--line);
    align-items: baseline;
    transition: all .3s;
  }
  .ent-row:hover { background: var(--accent-tint); }
  .ent-row:hover .ent-year { color: var(--accent); }
  .ent-year {
    font-family: 'EB Garamond', serif; font-size: 32px;
    color: var(--muted); font-weight: 400; font-style: italic;
    transition: color .3s;
  }
  .ent-company {
    font-family: 'EB Garamond', serif; font-size: 26px; line-height: 1.2;
    font-weight: 500; margin-bottom: 6px;
  }
  .ent-role {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase;
  }
  .ent-body { font-size: 14px; color: var(--ink-2); line-height: 1.65; }
  .ent-period { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 6px; display: block; }

  /* ——— samsung ——— */
  #samsung { background: var(--bg-2); }
  .sam-hero { display: grid; grid-template-columns: 1.7fr 1fr; gap: 60px; align-items: end; margin-bottom: 80px; }
  .sam-heading {
    font-size: clamp(40px, 4.5vw, 76px);
    white-space: pre-line;
    line-height: 1.05;
    word-break: keep-all; line-break: strict; overflow-wrap: normal;
  }
  .sam-note {
    font-family: 'EB Garamond', serif;
    font-size: 20px; line-height: 1.55; color: var(--ink-2);
    padding-bottom: 20px; font-style: italic; font-weight: 400;
  }
  .sam-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .sam-item { padding-top: 20px; border-top: 1px solid var(--ink); }
  .sam-item h4 {
    font-family: 'EB Garamond', serif; font-size: 20px; line-height: 1.3;
    font-weight: 500; margin-bottom: 10px; color: var(--ink);
  }
  .sam-item p { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ——— stack ——— */
  .stack-heading { font-size: clamp(48px, 6.5vw, 104px); margin-bottom: 60px; }
  .stack-groups { display: grid; grid-template-columns: repeat(5, 1fr); gap: 32px; border-top: 1px solid var(--ink); padding-top: 40px; }
  .stack-group-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px;
  }
  .stack-items { display: flex; flex-direction: column; gap: 10px; }
  .stack-item {
    font-family: 'EB Garamond', serif; font-size: 18px; color: var(--ink);
    font-weight: 400; line-height: 1.3;
  }

  /* ——— education ——— */
  .edu-heading { font-size: clamp(48px, 6.5vw, 104px); margin-bottom: 40px; }
  .edu-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 60px; border-top: 1px solid var(--line); padding-top: 40px; }
  .edu-block h4 {
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px;
  }
  .edu-item {
    padding: 12px 0; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline; gap: 20px;
  }
  .edu-item .name { font-family: 'EB Garamond', serif; font-size: 17px; font-weight: 400; }
  .edu-item .meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }

  /* ——— contact ——— */
  #contact {
    background: var(--ink); color: var(--paper);
    align-items: center; text-align: center;
    padding: 140px 12vw;
  }
  #contact::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(74,125,92,.15), transparent 60%);
    pointer-events: none;
  }
  #contact > * { position: relative; }
  #contact .kicker { color: var(--accent-hi); justify-content: center; }
  #contact .kicker::before { color: rgba(248,245,235,.4); border-right-color: rgba(248,245,235,.15); }
  .contact-heading {
    font-family: 'EB Garamond', serif; font-weight: 400;
    font-size: clamp(56px, 9vw, 160px);
    line-height: 0.95; color: var(--paper);
    margin-bottom: 40px;
  }
  .contact-heading em { color: var(--accent-hi); font-style: italic; }
  .contact-body {
    font-family: 'EB Garamond', serif; font-size: 24px; line-height: 1.5;
    color: rgba(248,245,235,.75); margin-bottom: 60px; white-space: pre-line;
    font-weight: 400;
  }
  .contact-methods { display: inline-flex; flex-direction: column; gap: 16px; align-items: stretch; min-width: 380px; }
  .contact-item {
    display: grid; grid-template-columns: 100px 1fr;
    gap: 20px; align-items: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 14px;
    color: var(--paper); letter-spacing: 0.03em;
    padding: 18px 24px; border: 1px solid rgba(248,245,235,.2);
    border-radius: 4px; transition: all .3s;
    text-align: left;
  }
  .contact-item:hover {
    background: var(--accent); border-color: var(--accent);
  }
  .contact-item .lbl { color: rgba(248,245,235,.5); font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; }
  .contact-footer {
    position: absolute; bottom: 40px; left: 12vw; right: 12vw;
    display: flex; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace; font-size: 10px;
    color: rgba(248,245,235,.4); letter-spacing: 0.15em; text-transform: uppercase;
  }

  @media (max-width: 900px) {
    section { padding: 100px 6vw 80px; }
    .hero-body, .vc-hero, .sam-hero { grid-template-columns: 1fr; gap: 40px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stat { border-right: none; border-bottom: 1px solid var(--line); }
    .why-points, .now-grid, .built-list, .stack-groups, .sam-grid, .vc-badges, .vc-tenets, .edu-grid { grid-template-columns: 1fr 1fr; }
    .why-point, .cap-row, .ent-row { grid-template-columns: 60px 1fr; gap: 20px; }
    .why-point p, .cap-body, .ent-body { grid-column: 2; }
  }
</style>
</head>
<body>

<div class="spotlight" id="spotlight"></div>

<div class="chrome" id="chrome">
  <div class="brand">Jasmine Kim / Portfolio 2026</div>
  <div class="center">
    <span class="chapter-badge"><em id="chapterNum">01</em>/<span id="chapterTotal">13</span></span>
    <span class="chapter-title" id="chapterTitle">Hero</span>
  </div>
  <div class="right">
    <span class="lang-toggle">
      <button data-lang="ko" class="active">KO</button>
      <button data-lang="en">EN</button>
    </span>
  </div>
</div>

<nav class="toc" id="toc"></nav>

<main id="main"></main>

<script src="shared/content.js"></script>
<script>
(function() {
  const C = window.PORTFOLIO_CONTENT;
  let lang = localStorage.getItem('ilsuk_lang') || 'ko';
  const t = (v) => (v && typeof v === 'object' && (v.ko || v.en)) ? (v[lang] || v.ko || v.en) : v;

  const CHAPTERS = [
    { id: 'hero',        num: '01', title: { ko: '표지', en: 'Cover' } },
    { id: 'vision',      num: '02', title: { ko: '비전', en: 'Vision' } },
    { id: 'glance',      num: '03', title: { ko: '숫자', en: 'Numbers' } },
    { id: 'why',         num: '04', title: { ko: '왜 나인가', en: 'Why me' } },
    { id: 'capabilities',num: '05', title: { ko: '핵심 역량', en: 'Capabilities' } },
    { id: 'vc',          num: '06', title: { ko: 'VC-Framework', en: 'VC-Framework' } },
    { id: 'now',         num: '07', title: { ko: '현재', en: 'Now' } },
    { id: 'built',       num: '08', title: { ko: '만든 서비스', en: 'Shipped' } },
    { id: 'enterprise',  num: '09', title: { ko: '엔터프라이즈', en: 'Enterprise' } },
    { id: 'samsung',     num: '10', title: { ko: '삼성SDS', en: 'Samsung SDS' } },
    { id: 'stack',       num: '11', title: { ko: '스택', en: 'Stack' } },
    { id: 'education',   num: '12', title: { ko: '학력·자격', en: 'Education' } },
    { id: 'contact',     num: '13', title: { ko: '연락', en: 'Contact' } },
  ];

  function renderHero() {
    const isKo = lang === 'ko';
    return `
      <section id="hero" data-chapter="01" data-screen-label="01 Hero">
        <div class="hero-marks">
          <span>Portfolio · 2026</span>
          <span>Concept B · Deep Forest</span>
          <span>Volume I</span>
        </div>
        <div class="hero-name-row">
          <div class="hero-name">${isKo?'김일석':'Ilsuk <span class="italic">Kim</span>'}</div>
          <div class="hero-badge">Available for hire · ${isKo?'상담 가능':'Open to talk'}</div>
        </div>
        <div class="hero-body">
          <div>
            <div class="label">Position</div>
            <div class="hero-position-full">Forward Deployed AI Engineer<br/><em style="font-style:italic;color:var(--accent)">Technical Product Manager</em></div>
          </div>
          <div>
            <div class="label">${isKo?'한 줄 소개':'One line'}</div>
            <div class="hero-tagline">${isKo?'AI 서비스를 <em>실제로 만들어 본</em> PM.<br/>30년의 엔터프라이즈, 2년의 실전 AI.':'A PM who has <em>actually shipped</em> AI products.<br/>30 years of enterprise, 2 years of real AI.'}</div>
          </div>
        </div>
      </section>
    `;
  }

  function renderVision() {
    return `
      <section id="vision" data-chapter="02" data-screen-label="02 Vision">
        <div class="kicker" data-num="02">${t(C.vision.kicker)}</div>
        <h2 class="vision-heading">${t(C.vision.heading).replace(/AI 서비스를 “만드는” PM|a PM who builds AI products/g, m => `<em>${m}</em>`)}</h2>
        <div class="vision-body">${t(C.vision.body)}</div>
      </section>
    `;
  }

  function renderStats() {
    const items = C.stats.map((s, i) => `
      <div class="stat">
        <div class="stat-num ${i===1||i===3?'italic':''}">${s.value}${i===0?'<sup>yrs</sup>':''}</div>
        <div class="stat-label">${t(s.label)}</div>
        <div class="stat-note">${t(s.note)}</div>
      </div>
    `).join('');
    return `
      <section id="glance" data-chapter="03" data-screen-label="03 At a glance">
        <div class="kicker" data-num="03">At a glance</div>
        <h2 class="stats-heading">${lang==='ko'?'숫자로 먼저, <em>맥락으로 다음</em>.':'The <em>numbers</em>, then the context.'}</h2>
        <div class="stats">${items}</div>
      </section>
    `;
  }

  function renderWhy() {
    const points = C.whyMe.points.map((p, i) => `
      <div class="why-point">
        <div class="why-point-no">${(i+1).toString().padStart(2,'0')}</div>
        <h3>${t(p.title)}</h3>
        <p>${t(p.body)}</p>
      </div>
    `).join('');
    return `
      <section id="why" data-chapter="04" data-screen-label="04 Why me">
        <div class="kicker" data-num="04">${t(C.whyMe.kicker)}</div>
        <h2 class="why-heading">${t(C.whyMe.heading).replace(/드뭅니다|rarer than you think/g, m => `<em>${m}</em>`)}</h2>
        <div class="why-points">${points}</div>
      </section>
    `;
  }

  function renderCapabilities() {
    const rows = C.capabilities.items.map(item => `
      <div class="cap-row">
        <div class="cap-no">${item.no}</div>
        <div class="cap-tag">${t(item.tag)}</div>
        <div class="cap-title">${t(item.title)}</div>
        <div class="cap-body">${t(item.body)}</div>
      </div>
    `).join('');
    return `
      <section id="capabilities" data-chapter="05" data-screen-label="05 Capabilities">
        <div class="kicker" data-num="05">${t(C.capabilities.kicker)}</div>
        <h2 class="cap-heading">${t(C.capabilities.heading).replace(/합니다|do/g, m => `<em>${m}</em>`)}</h2>
        <div class="cap-table">${rows}</div>
      </section>
    `;
  }

  function renderVC() {
    const badges = C.vc.badges.map(b => `
      <div class="vc-badge">
        <div class="vc-badge-label">${t(b.label)}</div>
        <div class="vc-badge-value">${t(b.value)}</div>
      </div>
    `).join('');
    const tenets = C.vc.tenets.map((tn, i) => `
      <div class="vc-tenet">
        <span class="vc-tenet-no">${(i+1).toString().padStart(2,'0')}.</span>
        <div class="vc-tenet-body">${t(tn)}</div>
      </div>
    `).join('');
    return `
      <section id="vc" data-chapter="06" data-screen-label="06 VC-Framework">
        <div class="kicker" data-num="06">${t(C.vc.kicker)}</div>
        <div class="vc-hero">
          <div>
            <h2 class="vc-title">${t(C.vc.heading).replace(/Vibe Coding/g, '<span class="italic">Vibe Coding</span>')}</h2>
            <div class="vc-cert"><span class="seal"></span>${lang==='ko'?'한국저작권위원회 등록 · 특허 출원 중':'Registered · Patent pending'}</div>
          </div>
          <div class="vc-lede">${t(C.vc.lede)}</div>
        </div>
        <div class="vc-badges">${badges}</div>
        <div class="vc-tenets">${tenets}</div>
      </section>
    `;
  }

  function renderNow() {
    const items = C.now.items.map(item => `
      <div class="now-item">
        <div class="status">${lang==='ko'?'진행 중':'Active'}</div>
        <h3>${t(item.title)}</h3>
        <p>${t(item.body)}</p>
      </div>
    `).join('');
    return `
      <section id="now" data-chapter="07" data-screen-label="07 Now">
        <div class="kicker" data-num="07">${t(C.now.kicker)}</div>
        <div class="now-header">
          <h2 class="now-heading">${t(C.now.heading).replace(/일|now/g, m => `<em>${m}</em>`)}</h2>
          <div class="now-range">${t(C.now.range)}</div>
        </div>
        <div class="now-grid">${items}</div>
      </section>
    `;
  }

  function renderBuilt() {
    const items = C.builtSites.items.map((s, i) => `
      <a class="built-card" href="https://${s.url}" target="_blank" rel="noopener">
        <div class="built-num">/ ${(i+1).toString().padStart(2,'0')}</div>
        <div class="built-name">${s.name.replace(/([A-Z][a-z]+)$/, '<span class="italic">$1</span>')}</div>
        <div class="built-url">${s.url} →</div>
        <div class="built-desc">${t(s.desc)}</div>
      </a>
    `).join('');
    return `
      <section id="built" data-chapter="08" data-screen-label="08 Shipped">
        <div class="kicker" data-num="08">${t(C.builtSites.kicker)}</div>
        <h2 class="built-heading">${t(C.builtSites.heading).replace(/만든|shipped/g, m => `<em>${m}</em>`)}</h2>
        <div class="built-list">${items}</div>
      </section>
    `;
  }

  function renderEnterprise() {
    const rows = C.enterpriseCareer.items.map(item => `
      <div class="ent-row">
        <div class="ent-year">${item.year}</div>
        <div>
          <div class="ent-company">${t(item.company)}</div>
          <div class="ent-role">${t(item.role)}</div>
          <span class="ent-period">${item.period}</span>
        </div>
        <div class="ent-body">${t(item.body)}</div>
      </div>
    `).join('');
    return `
      <section id="enterprise" data-chapter="09" data-screen-label="09 Enterprise">
        <div class="kicker" data-num="09">${t(C.enterpriseCareer.kicker)}</div>
        <h2 class="ent-heading">${t(C.enterpriseCareer.heading).replace(/시간|scale/g, m => `<em>${m}</em>`)}</h2>
        <div class="ent-list">${rows}</div>
      </section>
    `;
  }

  function renderSamsung() {
    const items = C.samsungEra.items.map(item => `
      <div class="sam-item">
        <h4>${t(item.title)}</h4>
        <p>${t(item.body)}</p>
      </div>
    `).join('');
    return `
      <section id="samsung" data-chapter="10" data-screen-label="10 Samsung SDS">
        <div class="kicker" data-num="10">${t(C.samsungEra.kicker)}</div>
        <div class="sam-hero">
          <h2 class="sam-heading">${t(C.samsungEra.heading).replace(/안에서 만들었습니다|from the inside/g, m => `<em>${m}</em>`)}</h2>
          <div class="sam-note">${lang==='ko'?'삼성전자 온라인스토어 · 서비스 지식 포털 · mySingle 그룹웨어 · PMS 솔루션.\n한 세대의 시스템을, 안에서.':'Samsung eStore · Service Knowledge Portal · mySingle · PMS.\nA generation of systems, built from the inside.'}</div>
        </div>
        <div class="sam-grid">${items}</div>
      </section>
    `;
  }

  function renderStack() {
    const groups = C.stack.groups.map(g => `
      <div class="stack-group">
        <div class="stack-group-label">${t(g.label)}</div>
        <div class="stack-items">
          ${g.items.map(x => `<span class="stack-item">${x}</span>`).join('')}
        </div>
      </div>
    `).join('');
    return `
      <section id="stack" data-chapter="11" data-screen-label="11 Stack">
        <div class="kicker" data-num="11">${t(C.stack.kicker)}</div>
        <h2 class="stack-heading">${t(C.stack.heading).replace(/것들|with/g, m => `<em>${m}</em>`)}</h2>
        <div class="stack-groups">${groups}</div>
      </section>
    `;
  }

  function renderEducation() {
    const schools = C.education.schools.map(s => `
      <div class="edu-item">
        <span class="name">${t(s.school)}</span>
        <span class="meta">${s.year} · ${t(s.major)}</span>
      </div>
    `).join('');
    const certs = C.education.certs.map(c => `<div class="edu-item"><span class="name">${t(c)}</span></div>`).join('');
    const langs = C.education.languages.map(l => `<div class="edu-item"><span class="name">${t(l)}</span></div>`).join('');
    return `
      <section id="education" data-chapter="12" data-screen-label="12 Education">
        <div class="kicker" data-num="12">${t(C.education.kicker)}</div>
        <h2 class="edu-heading">${t(C.education.heading).replace(/자격|credentials/g, m => `<em>${m}</em>`)}</h2>
        <div class="edu-grid">
          <div class="edu-block"><h4>${lang==='ko'?'학력':'Schools'}</h4>${schools}</div>
          <div class="edu-block"><h4>${lang==='ko'?'자격 · 인증':'Certifications'}</h4>${certs}</div>
          <div class="edu-block"><h4>${lang==='ko'?'언어':'Languages'}</h4>${langs}</div>
        </div>
      </section>
    `;
  }

  function renderContact() {
    return `
      <section id="contact" data-chapter="13" data-screen-label="13 Contact">
        <div class="kicker" data-num="13">${t(C.contact.kicker)}</div>
        <h2 class="contact-heading">${t(C.contact.heading).replace(/만들어 볼까요|build together/g, m => `<em>${m}</em>`)}</h2>
        <div class="contact-body">${t(C.contact.body)}</div>
        <div class="contact-methods">
          <a class="contact-item" href="mailto:${C.meta.email}"><span class="lbl">Email</span><span>${C.meta.email}</span></a>
        </div>
        <div class="contact-footer">
          <span>© 2026 Jasmine Kim</span>
          <span>Concept B · Deep Forest</span>
        </div>
      </section>
    `;
  }

  function renderTOC() {
    return CHAPTERS.map(c => `
      <a class="toc-item" data-id="${c.id}" href="#${c.id}">
        <span class="dot"></span>
        <span>${c.num}</span>
        <span class="label">${t(c.title)}</span>
      </a>
    `).join('');
  }

  function render() {
    document.getElementById('main').innerHTML = [
      renderHero(), renderVision(), renderStats(), renderWhy(), renderCapabilities(),
      renderVC(), renderNow(), renderBuilt(), renderEnterprise(),
      renderSamsung(), renderStack(), renderEducation(), renderContact(),
    ].join('');
    document.getElementById('toc').innerHTML = renderTOC();
    document.getElementById('chapterTotal').textContent = CHAPTERS.length.toString().padStart(2,'0');
    attachTocClicks();
  }

  function attachTocClicks() {
    document.querySelectorAll('.toc-item').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        const target = document.getElementById(el.dataset.id);
        if (target) window.scrollTo({ top: target.offsetTop, behavior: 'smooth' });
      });
    });
  }

  // spotlight
  const spot = document.getElementById('spotlight');
  document.addEventListener('mousemove', e => {
    spot.style.setProperty('--mx', e.clientX + 'px');
    spot.style.setProperty('--my', e.clientY + 'px');
  });

  // chapter tracking
  function updateChapter() {
    const sections = document.querySelectorAll('section[data-chapter]');
    const mid = window.innerHeight / 2;
    let current = CHAPTERS[0];
    sections.forEach(s => {
      const r = s.getBoundingClientRect();
      if (r.top <= mid && r.bottom >= mid) {
        current = CHAPTERS.find(c => c.id === s.id) || current;
      }
    });
    document.getElementById('chapterNum').textContent = current.num;
    document.getElementById('chapterTitle').textContent = t(current.title);
    document.querySelectorAll('.toc-item').forEach(el =>
      el.classList.toggle('active', el.dataset.id === current.id));
    document.getElementById('chrome').classList.toggle('scrolled', window.scrollY > 40);
  }
  window.addEventListener('scroll', updateChapter, { passive: true });

  document.querySelectorAll('.lang-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      lang = btn.dataset.lang;
      localStorage.setItem('ilsuk_lang', lang);
      document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.documentElement.lang = lang === 'ko' ? 'ko' : 'en';
      render(); updateChapter();
    });
  });

  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.documentElement.lang = lang === 'ko' ? 'ko' : 'en';
  render();
  updateChapter();
})();
</script>

</body>
</html>
